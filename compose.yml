name: klyde-backend

services:
  # Redis
  redis:
    image: mirror.gcr.io/eqalpha/keydb
    ports:
      - "6379:6379"

  # PostgreSQL
  database:
    image: mirror.gcr.io/postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: revolt
    ports:
      - "5432:5432"
    volumes:
      - ./.data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d revolt"]
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30

  # Silo: The artist formerly known as MinIO: S3-compatible storage server
  minio:
    image: mirror.gcr.io/pgsty/silo
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioautumn
      MINIO_ROOT_PASSWORD: minioautumn
      MINIO_REGION: minio
    volumes:
      - ./.data/minio:/data
    ports:
      - "14009:9000"
      - "14010:9001"
    restart: always

  # Create buckets for Silo.
  createbuckets:
    image: mirror.gcr.io/pgsty/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "while ! /usr/bin/mc ready minio; do
        /usr/bin/mc alias set minio http://minio:9000 minioautumn minioautumn;
        echo 'Waiting minio...' && sleep 1;
      done; /usr/bin/mc mb minio/revolt-uploads; exit 0;"

  # Rabbit
  rabbit:
    image: mirror.gcr.io/rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: rabbituser
      RABBITMQ_DEFAULT_PASS: rabbitpass
    volumes:
      - ./.data/rabbit:/var/lib/rabbitmq
      #- ./rabbit_plugins:/opt/rabbitmq/plugins/
      #- ./rabbit_enabled_plugins:/etc/rabbitmq/enabled_plugins
      # uncomment this if you need to enable other plugins
    ports:
      - "5672:5672"
      - "15672:15672" # management UI, for development

  # Mock SMTP server
  maildev:
    image: mirror.gcr.io/maildev/maildev:2.2.1
    ports:
      - "14025:25"
      - "14080:8080"
    environment:
      MAILDEV_SMTP_PORT: 25
      MAILDEV_WEB_PORT: 8080
      MAILDEV_INCOMING_USER: smtp
      MAILDEV_INCOMING_PASS: smtp

  # LiveKit
  livekit:
    image: ghcr.io/klydechat/livekit-server:v1.9.13
    command: --config /etc/livekit.yml
    network_mode: "host"
    volumes:
      - ./livekit.yml:/etc/livekit.yml

  # Grafana LGTM (OTel Collector + Loki + Tempo + Prometheus + Grafana)
  otel-lgtm:
    image: grafana/otel-lgtm:0.35.0
    ports:
      - "13000:3000" # Grafana UI
      - "4318:4318" # OTLP/HTTP

  # Waits for dependencies, used by `mise docker:start`
  wait:
    image: dokku/wait
    command: -c rabbit:5672,database:5432,redis:6379
    profiles: [tools]
